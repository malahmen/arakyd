name: ci

# Every push and pull request. The suite needs no network, no root and no
# particular hardware: the collector is driven against a fabricated sysfs tree,
# which is the only way to test a thing whose whole job is knowing about one
# machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tools
        # Installed rather than assumed. GitHub's runner image ships shellcheck;
        # the Gitea runner's job image (catthehacker/ubuntu:act-22.04, kuat's
        # gitea_runner) has neither shellcheck nor apt package lists, so the
        # Versions step and the old `apt-get install systemd` both failed there
        # before a line of this repository was checked - and once a branch
        # protection rule requires this job, a failure for the image's sake
        # blocks every merge.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck systemd >/dev/null

      - name: Versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          python3 --version

      - name: shellcheck
        # -S warning, matching every sibling repo. Without it the build depends
        # on which style checks the runner's shellcheck happens to enable by
        # default: 0.11.0 has SC2002 off, the runner's older build has it on,
        # so "clean locally" did not mean "green in CI". The version printed
        # above is what makes that visible next time.
        #
        # Globbed, not listed: a named list quietly stops covering the next
        # test file somebody adds.
        run: shellcheck -S warning arakyd.sh tests/*.sh

      - name: systemd units parse
        # systemd-analyze verify catches a typo'd directive, which otherwise
        # surfaces as a unit that silently does not start. It also complains
        # that %h/.local/bin/arakyd.sh is not there, which on a runner it is
        # not; that line is expected and filtered, and ANY other line fails
        # the step. It used to pipe into `grep ... || true`, which could not
        # fail (Kamino item 133).
        run: |
          out="$(for u in quadlet/*.service quadlet/*.timer; do
                   systemd-analyze verify "$u" 2>&1
                 done | grep -viE 'is not executable|Unit .* not found|No such file or directory|Failed to prepare filename' || true)"
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

      - name: the quadlet container generates
        # quadlet (podman >= 4.4) turns the .container into a unit; an error
        # there is a container that never starts. The Gitea runner's job image
        # has no podman, so this says it skipped rather than passing quietly.
        run: |
          q=/usr/libexec/podman/quadlet
          if [ ! -x "$q" ]; then echo "SKIP: no quadlet on this runner - the .container is not checked here"; exit 0; fi
          QUADLET_UNIT_DIRS="$PWD/quadlet" "$q" -user -dryrun > /tmp/quadlet.out 2>&1 || { cat /tmp/quadlet.out; exit 1; }
          grep -q '^ExecStart=.*node-exporter' /tmp/quadlet.out || { cat /tmp/quadlet.out; exit 1; }

      - name: the dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana-hosts-dashboard.json > /dev/null

      - name: tests
        run: tests/run-all.sh
